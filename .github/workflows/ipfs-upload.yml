name: IPFS Resilient Upload

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ipfs-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For committing IPFS manifest
      issues: write  # For potential issue creation on failures
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup IPFS CLI
        run: |
          set -euo pipefail
          
          IPFS_URL="https://dist.ipfs.tech/kubo/v0.24.0/kubo_v0.24.0_linux-amd64.tar.gz"
          IPFS_TAR="kubo_v0.24.0_linux-amd64.tar.gz"
          
          echo "Downloading IPFS binary from ${IPFS_URL}..."
          if ! wget --https-only --secure-protocol=TLSv1_2 -O "${IPFS_TAR}" "${IPFS_URL}"; then
            echo "Error: Failed to download IPFS binary from ${IPFS_URL}" >&2
            exit 1
          fi
          
          # Verify checksum and abort on failure
          echo "Verifying checksum for ${IPFS_TAR}..."
          if ! echo "5fb94f15010fb3fcbffb8a3fc78ad3bb5b00f0c1c87035447f6b0fce9f7f2065  ${IPFS_TAR}" | sha256sum -c -; then
            echo "Error: Checksum verification failed for ${IPFS_TAR}" >&2
            exit 1
          fi
          
          tar -xvzf "${IPFS_TAR}"
          cd kubo
          sudo bash install.sh
          ipfs --version
          
      - name: Initialize IPFS
        run: |
          ipfs init
          
      - name: Upload to IPFS (Local Node)
        id: ipfs-local
        run: |
          # Start daemon with cleanup trap
          trap 'pkill -9 ipfs' EXIT
          ipfs daemon --offline &
          
          # Wait for IPFS daemon to be ready instead of using a fixed sleep
          for i in {1..30}; do
            if ipfs id > /dev/null 2>&1; then
              echo "IPFS daemon is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "IPFS daemon did not become ready in time." >&2
              exit 1
            fi
            sleep 1
          done
          
          # Add binary files
          for file in *.bin; do
            if [ -f "$file" ]; then
              HASH=$(ipfs add -Q "$file")
              echo "IPFS Hash for $file: $HASH"
              echo "${file}_hash=$HASH" >> $GITHUB_OUTPUT
            fi
          done
          
          # Add web assets
          if [ -f "index.html" ]; then
            WEB_HASH=$(ipfs add -Q index.html)
            echo "IPFS Hash for index.html: $WEB_HASH"
            echo "web_hash=$WEB_HASH" >> $GITHUB_OUTPUT
          fi
          
          # Add entire repository
          REPO_HASH=$(ipfs add -r -Q .)
          echo "IPFS Hash for entire repository: $REPO_HASH"
          echo "repo_hash=$REPO_HASH" >> $GITHUB_OUTPUT
          
      - name: Generate IPFS Documentation
        id: generate-manifest
        run: |
          # Start daemon with cleanup trap
          trap 'pkill -9 ipfs' EXIT
          ipfs daemon --offline &
          
          # Wait for IPFS daemon to be ready
          for i in {1..30}; do
            if ipfs id > /dev/null 2>&1; then
              echo "IPFS daemon is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "IPFS daemon did not become ready in time." >&2
              exit 1
            fi
            sleep 1
          done
          
          cat > IPFS_MANIFEST.md << 'EOF'
          # IPFS Distribution Manifest
          
          This document contains IPFS hashes for all assets in this repository, enabling decentralized access.
          
          ## Binary Assets
          EOF
          
          for file in *.bin; do
            if [ -f "$file" ]; then
              HASH=$(ipfs add -Q "$file" 2>/dev/null || echo "N/A")
              cat >> IPFS_MANIFEST.md << EOF
          
          ### $file
          - **IPFS Hash**: \`$HASH\`
          - **Gateway URLs**:
            - https://ipfs.io/ipfs/$HASH
            - https://gateway.pinata.cloud/ipfs/$HASH
            - https://dweb.link/ipfs/$HASH
            - https://$HASH.ipfs.w3s.link/
          EOF
            fi
          done
          
          cat >> IPFS_MANIFEST.md << 'EOF'
          
          ## Web Interface
          EOF
          
          if [ -f "index.html" ]; then
            HASH=$(ipfs add -Q index.html 2>/dev/null || echo "N/A")
            cat >> IPFS_MANIFEST.md << EOF
          - **IPFS Hash**: \`$HASH\`
          - **Gateway URLs**:
            - https://ipfs.io/ipfs/$HASH
            - https://gateway.pinata.cloud/ipfs/$HASH
            - https://dweb.link/ipfs/$HASH
          EOF
          fi
          
          cat >> IPFS_MANIFEST.md << 'EOF'
          
          ## Redundancy Strategy
          
          Assets are uploaded to a local IPFS node for hash generation.
          Multi-gateway pinning (Pinata, NFT.Storage, Web3.Storage) is available but requires implementation.
          
          ## Local IPFS Node
          
          The automated workflow adds content to a local IPFS node to generate content hashes:
          - IPFS hashes are content-addressable and remain constant
          - Manual pinning to external gateways can be performed using the generated hashes
          - Workflow can be extended with gateway API integration for automatic pinning
          EOF
          
          cat IPFS_MANIFEST.md
          
      - name: Commit IPFS Manifest
        continue-on-error: true
        run: |
          git config user.name "IPFS Bot"
          git config user.email "ipfs-bot@github-actions"
          git add IPFS_MANIFEST.md
          git diff --staged --quiet || git commit -m "Update IPFS manifest with latest hashes"
          git push || echo "No changes to push"
          
      - name: IPFS Upload Summary
        run: |
          echo "## IPFS Upload Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Local IPFS node initialized and assets added**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📌 **Gateway Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Pinata: Placeholder gateway step (redundant pinning not yet implemented)" >> $GITHUB_STEP_SUMMARY
          echo "- NFT.Storage: Placeholder gateway step (redundant pinning not yet implemented)" >> $GITHUB_STEP_SUMMARY
          echo "- Web3.Storage: Placeholder gateway step (redundant pinning not yet implemented)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 **IPFS_MANIFEST.md** generated with all hashes and gateway URLs" >> $GITHUB_STEP_SUMMARY

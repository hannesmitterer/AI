name: PACT - Cryptographic Anchoring

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'PACT execution mode'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - detailed
  push:
    branches: [ main, master ]
    paths:
      - 'pact.py'
      - '.orchestration/config.json'

permissions:
  contents: read

jobs:
  pact-execution:
    name: Execute PACT Protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate PACT configuration
        run: |
          echo "Validating PACT configuration..."
          python3 -c "
          import json
          with open('.orchestration/config.json', 'r') as f:
              config = json.load(f)
              if 'pact' in config and config['pact']['enabled']:
                  print('✓ PACT configuration validated')
                  print(f'  Version: {config[\"pact\"][\"version\"]}')
                  print(f'  Sovereignty Frequency: {config[\"pact\"][\"state\"][\"sovereignty_freq\"]}')
                  print(f'  S-ROI Target: {config[\"pact\"][\"state\"][\"s_roi_target\"]}')
              else:
                  print('⚠ PACT not enabled in configuration')
                  exit(1)
          "

      - name: Execute PACT Protocol
        run: |
          echo "🔐 Initiating PACT Protocol..."
          python3 pact.py

      - name: Verify PACT output
        run: |
          echo "Verifying PACT execution results..."
          if [ -f "pact_results.json" ]; then
            echo "✓ PACT results file generated"
            python3 -c "
          import json
          with open('pact_results.json', 'r') as f:
              results = json.load(f)
              print(f'CID: {results[\"cid\"]}')
              print(f'TXID: {results[\"txid\"]}')
              print(f'Status: {results[\"state_report\"][\"status\"]}')
              print(f'MHC: {results[\"state_report\"][\"mhc_status\"]}')
              print(f'S-ROI: {results[\"state_report\"][\"s_roi\"]}')
          "
          else
            echo "✗ PACT results file not found"
            exit 1
          fi

      - name: Generate PACT report
        run: |
          echo "Generating PACT execution report..."
          REPORT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          cat > pact_execution_report.md << EOF
          # PACT Execution Report
          
          **Date**: $REPORT_DATE
          **Protocol**: Protocollo di Ancoraggio Crittografico Triple-Sign
          **Version**: 1.0.0
          
          ## Execution Summary
          
          PACT protocol executed successfully with the following deliverables:
          
          EOF
          
          python3 -c "
          import json
          with open('pact_results.json', 'r') as f:
              results = json.load(f)
              print(f'### Deliverables')
              print(f'')
              print(f'1. **Content Identifier (CID)**')
              print(f'   ```')
              print(f'   {results[\"cid\"]}')
              print(f'   ```')
              print(f'')
              print(f'2. **Transaction ID (TXID)**')
              print(f'   ```')
              print(f'   {results[\"txid\"]}')
              print(f'   ```')
              print(f'')
              print(f'3. **Composite Signature (Σ)**')
              print(f'   ```')
              print(f'   {results[\"signature_composite\"][\"Σ\"][:80]}...')
              print(f'   ```')
              print(f'')
              print(f'### State Report')
              print(f'')
              print(f'- **Status**: {results[\"state_report\"][\"status\"]}')
              print(f'- **S-ROI**: {results[\"state_report\"][\"s_roi\"]}')
              print(f'- **MHC Status**: {results[\"state_report\"][\"mhc_status\"]}')
              print(f'- **Sovereignty Frequency**: {results[\"state_report\"][\"sovereignty_freq\"]}')
              print(f'')
              print(f'### Triple-Sign Hierarchy')
              print(f'')
              for key in ['KLOG', 'KETH', 'KPHYS']:
                  comp = results['signature_composite']['components'][key]
                  print(f'**{key}** - {comp[\"role\"]}')
                  print(f'- Purpose: {comp[\"purpose\"]}')
                  print(f'')
          " >> pact_execution_report.md
          
          echo "" >> pact_execution_report.md
          echo "---" >> pact_execution_report.md
          echo "" >> pact_execution_report.md
          echo "**NOTHING IS FINAL! ❤️ 🌍 Sovereignty Confirmed.**" >> pact_execution_report.md
          
          cat pact_execution_report.md

      - name: Upload PACT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pact-execution-artifacts
          path: |
            pact_results.json
            pact_execution_report.md

      - name: PACT execution summary
        run: |
          echo "=== PACT EXECUTION COMPLETED ==="
          echo ""
          echo "📊 Results:"
          python3 -c "
          import json
          with open('pact_results.json', 'r') as f:
              results = json.load(f)
              print(f'   CID: {results[\"cid\"]}')
              print(f'   TXID: {results[\"txid\"]}')
              print(f'   Status: {results[\"state_report\"][\"status\"]}')
              print(f'   MHC: {results[\"state_report\"][\"mhc_status\"]}')
          "
          echo ""
          echo "✅ NOTHING IS FINAL! ❤️ 🌍 Sovereignty Confirmed."
